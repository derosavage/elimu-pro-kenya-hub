services:
  - type: web
    name: elimupro-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --access-logfile - --error-logfile - run:app
    healthCheckPath: /api/v1/health/ready
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: elimupro-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://elimu-pro-kenya-hub-juqh.vercel.app,https://elimupro.co.ke
      - key: JWT_ACCESS_HOURS
        value: "12"

databases:
  - name: elimupro-db
    plan: free
    ipAllowList: []
    postgresMajorVersion: "16"