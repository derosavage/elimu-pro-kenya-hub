services:
  - type: web
    name: elimupro-backend
    runtime: python
    plan: free
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --access-logfile - --error-logfile - run:app
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        value: https://elimu-pro-kenya-hub-juqh.vercel.app,https://elimupro.co.ke
      - key: JWT_ACCESS_HOURS
        value: "12"

  # PostgreSQL Database (add separately in Render dashboard)
